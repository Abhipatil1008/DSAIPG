[sortbenchmark]
version = 1.0.0 (sortbenchmark)

[helper]
instrument = true
seed =
cutoff =0
showStats = true

[instrumenting]
# The options in this section apply only if instrument (in [helper]) is set to true.
# This slows everything down a lot so keep this small (or zero)
inversions = 0
swaps = true
compares = true
copies = true
fixes = true
hits = true

[benchmarkstringsorters]
mergesort = false
timsort = false
quicksort = false
introsort = false
insertionsort = false
quicksort3way = false
quicksortDualPivot = false

[benchmarkintegersorters]
quicksort = true
heapsort = false
mergesort = false
shellsort = false
bucketsort = false

[benchmarkdatesorters]
timsort = false

[mergesort]
insurance = false
nocopy = false
